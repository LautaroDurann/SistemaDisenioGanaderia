{% extends 'auth/base.html' %}
{% block title %}Iniciar sesión · GanaStock{% endblock %}
{% block subtitle %}Iniciá sesión para continuar{% endblock %}
{% block content %}
  {% if error %}
    <div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle me-1"></i>{{ error }}</div>
  {% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3">
      <label class="form-label">Nombre de usuario</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" name="nombre_usuario" class="form-control" placeholder="Ej: jfernandez" required autofocus>
      </div>
    </div>
    <div class="mb-4">
      <div class="d-flex justify-content-between align-items-center">
        <label class="form-label">Contraseña</label>
        <a href="{% url 'recuperar' %}" class="small">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="clave" class="form-control" required>
      </div>
    </div>
    <button type="submit" class="btn btn-success w-100 py-2">
      <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
    </button>
  </form>
{% endblock %}
